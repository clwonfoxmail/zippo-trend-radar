name: Bilibili Hot Radar

on:
  # 定时已关闭：B站采集已并入本机 daily_digest.py（08:10 / 20:10）
  # 保留手动触发作为备用
  workflow_dispatch:

concurrency:
  group: bili-radar
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --no-cache-dir requests
      - name: Run Bilibili radar
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        run: python scripts/bili_radar.py --send
